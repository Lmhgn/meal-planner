<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chefly — Weekly Meal Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f0;
  --white:#ffffff;
  --green:#2e7d32;
  --green-light:#e8f5e9;
  --dark:#1a1a1a;
  --mid:#4a4a4a;
  --muted:#777;
  --light:#aaa;
  --border:#e0e0e0;
  --border2:#f0f0f0;
  --shadow:0 1px 4px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --r:14px;--rs:10px;--rx:7px;
  --font:'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;font-family:var(--font);background:none}
input,textarea,select{font-family:var(--font)}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-logo-box{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.nav-brand{font-size:17px;font-weight:700;color:var(--dark)}
.nav-tabs{display:flex;gap:4px;margin-left:auto}
.nav-tab{padding:8px 18px;border-radius:var(--rx);font-size:14px;font-weight:500;color:var(--muted);transition:all .15s;position:relative}
.nav-tab:hover{color:var(--dark);background:var(--bg)}
.nav-tab.active{color:var(--green);font-weight:600;background:var(--green-light)}
.nav-tab .badge{position:absolute;top:4px;right:4px;background:var(--green);color:#fff;font-size:9px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* LAYOUT */
.page{display:none;max-width:1200px;margin:0 auto;padding:28px 24px 80px}
.page.active{display:block}

/* HERO */
.hero{margin-bottom:28px}
.hero h1{font-size:26px;font-weight:800;color:var(--dark);margin-bottom:4px}
.hero p{font-size:14px;color:var(--muted)}

.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-hdr h2{font-size:18px;font-weight:700}
.link-btn{font-size:13px;font-weight:600;color:var(--green);background:none;border:none;cursor:pointer}
.link-btn:hover{text-decoration:underline}

/* FILTER ROW */
.filter-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;align-items:center}
.filter-chip{padding:7px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:500;color:var(--dark);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.filter-chip:hover{border-color:#999}
.filter-chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.filter-chip.on-green{background:var(--green);color:#fff;border-color:var(--green)}
.servings-ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--white);border:1.5px solid var(--border);border-radius:99px;padding:5px 14px}
.srv-btn{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--dark);transition:background .15s}
.srv-btn:hover{background:var(--border)}
.srv-num{font-size:15px;font-weight:700;min-width:24px;text-align:center}
.srv-lbl{font-size:12px;color:var(--muted)}

/* RECIPE GRID */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:32px}
.rcard{background:var(--white);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:all .2s;border:1.5px solid transparent}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border)}
.rcard-top{height:160px;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#f9f9f7,#efefeb);position:relative}
.rcard-fav{position:absolute;top:10px;right:10px;width:30px;height:30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:transform .15s;z-index:1}
.rcard-fav:hover{transform:scale(1.2)}
.rcard-cat-dot{position:absolute;bottom:10px;left:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--dark);color:#fff;padding:3px 8px;border-radius:5px}
.rcard-body{padding:14px}
.rcard-name{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.3}
.rcard-meta{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.rcard-desc{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard-nutr{display:flex;gap:8px;margin-top:10px}
.nutr-pill{flex:1;text-align:center;background:var(--bg);border-radius:6px;padding:5px 4px}
.nutr-pill-val{display:block;font-size:12px;font-weight:700;color:var(--dark)}
.nutr-pill-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* PLAN PAGE */
.plan-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.plan-top h1{font-size:22px;font-weight:800;margin-bottom:4px}
.plan-top p{font-size:13px;color:var(--muted)}
.gen-btn{padding:12px 24px;background:var(--green);color:#fff;border-radius:var(--rs);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;transition:background .15s;white-space:nowrap;flex-shrink:0}
.gen-btn:hover{background:#256427}
.gen-btn:disabled{opacity:.6;cursor:not-allowed}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.day-hdr{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--white);border-radius:var(--rx);padding:8px 4px;margin-bottom:6px;border:1px solid var(--border)}
.day-hdr.today{background:var(--green);color:#fff;border-color:var(--green)}
.meal-slot{background:var(--white);border-radius:var(--rs);overflow:hidden;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer;transition:all .18s;border:1.5px solid transparent;min-height:90px;display:flex;flex-direction:column}
.meal-slot:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border)}
.meal-slot.empty{cursor:default;align-items:center;justify-content:center;background:var(--border2);box-shadow:none}
.meal-slot.empty:hover{transform:none;box-shadow:none;border-color:transparent}
.meal-slot-emoji{font-size:32px;text-align:center;padding:10px 8px 4px;background:linear-gradient(135deg,#f9f9f7,#efefeb)}
.meal-slot-body{padding:6px 8px 8px;flex:1}
.meal-slot-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.meal-slot-name{font-size:11px;font-weight:600;color:var(--dark);line-height:1.3}
.meal-slot-actions{display:flex;gap:3px;padding:0 6px 6px}
.slot-btn{width:22px;height:22px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;transition:background .12s}
.slot-btn:hover{background:var(--border)}
.empty-slot-txt{font-size:11px;color:var(--light);text-align:center;padding:8px}

.plan-pref{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center}
.pref-lbl{font-size:13px;font-weight:600;color:var(--mid);margin-right:4px}

/* SHOPPING */
.shop-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.shop-top h1{font-size:22px;font-weight:800;margin-bottom:4px}
.shop-top p{font-size:13px;color:var(--muted)}
.shop-top-btns{display:flex;gap:8px}
.outline-btn{padding:9px 16px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:600;color:var(--dark);transition:all .15s;cursor:pointer}
.outline-btn:hover{border-color:#999;background:var(--bg)}
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.prog-track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.prog-lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.shop-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:20px}
.shop-cat{background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.shop-cat-hdr{padding:11px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between}
.shop-cat-count{background:var(--green-light);color:var(--green);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.shop-items{list-style:none;padding:4px}
.shop-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .1s}
.shop-item:hover{background:var(--bg)}
.shop-item.done{opacity:.45}
.shop-item.done .shop-item-name{text-decoration:line-through}
.chkbox{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .12s}
.chkbox.on{background:var(--green);border-color:var(--green)}
.shop-item-name{flex:1;font-size:13px;color:var(--dark)}
.shop-item-qty{font-size:12px;color:var(--muted);font-weight:500}
.shop-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;text-align:center;color:var(--muted)}
.shop-empty-icon{font-size:48px;margin-bottom:12px}
.shop-empty p{font-size:14px;line-height:1.6;max-width:300px}

/* SAVED */
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.saved-empty{display:flex;flex-direction:column;align-items:center;padding:80px 20px;text-align:center;color:var(--muted)}
.saved-empty-icon{font-size:56px;margin-bottom:12px}
.saved-empty h2{font-size:20px;font-weight:700;color:var(--dark);margin-bottom:8px}
.saved-empty p{font-size:14px;max-width:320px;line-height:1.6}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.modal{background:var(--white);border-radius:20px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--white);z-index:1}
.modal-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--green);cursor:pointer;background:none;border:none}
.modal-back:hover{text-decoration:underline}
.modal-nav-actions{display:flex;gap:8px}
.modal-icon-btn{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .12s}
.modal-icon-btn:hover{background:var(--border)}
.modal-emoji{font-size:80px;text-align:center;padding:28px 20px 16px;background:linear-gradient(135deg,#f9f9f7,#efefeb)}
.modal-body{padding:20px 24px 32px}
.modal-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:6px}
.modal-title{font-size:26px;font-weight:800;color:var(--dark);margin-bottom:10px;line-height:1.2}
.modal-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.modal-stat{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:500;color:var(--dark)}
.modal-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border2)}
.modal-cols{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;margin-bottom:20px}
.modal-section h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--dark)}
.modal-section h3 span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.ing-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.ing-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.4}
.ing-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:5px}
.ing-qty{font-weight:700;color:var(--dark);min-width:40px}
.ing-name{color:var(--mid)}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.step-item{display:flex;gap:10px;font-size:13px;color:var(--mid);line-height:1.6}
.step-n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.nutr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.nutr-box{background:var(--bg);border-radius:var(--rx);padding:12px;text-align:center}
.nutr-box-val{font-size:22px;font-weight:800;color:var(--dark);display:block}
.nutr-box-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.add-plan-btn{width:100%;padding:14px;background:var(--green);color:#fff;border-radius:var(--rs);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;margin-top:20px;cursor:pointer;border:none}
.add-plan-btn:hover{background:#256427}

/* RESPONSIVE */
@media(max-width:900px){
  .week-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:640px){
  .page{padding:16px 14px 70px}
  .week-grid{grid-template-columns:repeat(2,1fr)}
  .modal-cols{grid-template-columns:1fr}
  .nav{padding:0 14px}
  .nav-tab{padding:8px 10px}
  .nutr-grid{grid-template-columns:repeat(2,1fr)}
}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">
    <div class="nav-logo-box">&#127807;</div>
    <span class="nav-brand">Chefly</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-page="home" onclick="showPage('home')">Recipes</button>
    <button class="nav-tab" data-page="plan" onclick="showPage('plan')">Plan</button>
    <button class="nav-tab" data-page="shop" onclick="showPage('shop')">Shopping</button>
    <button class="nav-tab" data-page="saved" onclick="showPage('saved')">Saved <span id="fav-badge" class="badge" style="display:none">0</span></button>
  </div>
</nav>

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="hero">
    <h1>What's for dinner?</h1>
    <p>Browse recipes, build your weekly plan, and get your shopping list automatically.</p>
  </div>
  <div class="filter-row" id="home-filters">
    <button class="filter-chip on-green" data-filter="all" onclick="toggleFilter(this,'all')">All</button>
    <button class="filter-chip" data-filter="vegetarian" onclick="toggleFilter(this,'vegetarian')">Vegetarian</button>
    <button class="filter-chip" data-filter="vegan" onclick="toggleFilter(this,'vegan')">Vegan</button>
    <button class="filter-chip" data-filter="meat" onclick="toggleFilter(this,'meat')">Meat &amp; Fish</button>
    <button class="filter-chip" data-filter="quick" onclick="toggleFilter(this,'quick')">Under 30 min</button>
    <button class="filter-chip" data-filter="highProtein" onclick="toggleFilter(this,'highProtein')">High Protein</button>
    <button class="filter-chip" data-filter="batchCook" onclick="toggleFilter(this,'batchCook')">Batch Cook</button>
    <div class="servings-ctrl">
      <button class="srv-btn" onclick="changeServings(-1)">&#8722;</button>
      <span class="srv-num" id="srv-num">2</span>
      <span class="srv-lbl">servings</span>
      <button class="srv-btn" onclick="changeServings(1)">+</button>
    </div>
  </div>
  <div class="section-hdr">
    <h2>Lunch Ideas</h2>
    <button class="link-btn" onclick="showPage('plan')">Build your plan &rarr;</button>
  </div>
  <div class="recipe-grid" id="grid-lunch"></div>
  <div class="section-hdr">
    <h2>Dinner Ideas</h2>
    <button class="link-btn" onclick="showPage('plan')">Build your plan &rarr;</button>
  </div>
  <div class="recipe-grid" id="grid-dinner"></div>
</div>

<!-- PLAN PAGE -->
<div class="page" id="page-plan">
  <div class="plan-top">
    <div>
      <h1>Weekly Plan</h1>
      <p id="plan-desc">Plan your meals for the week ahead.</p>
    </div>
    <button class="gen-btn" id="gen-btn" onclick="generatePlan()">Generate Plan</button>
  </div>
  <div class="plan-pref">
    <span class="pref-lbl">Filter by:</span>
    <button class="filter-chip" data-pref="vegetarian" onclick="togglePref(this,'vegetarian')">Vegetarian</button>
    <button class="filter-chip" data-pref="vegan" onclick="togglePref(this,'vegan')">Vegan</button>
    <button class="filter-chip" data-pref="meat" onclick="togglePref(this,'meat')">Meat &amp; Fish</button>
    <button class="filter-chip" data-pref="quick" onclick="togglePref(this,'quick')">Quick</button>
    <button class="filter-chip" data-pref="highProtein" onclick="togglePref(this,'highProtein')">High Protein</button>
  </div>
  <div class="week-grid" id="week-grid"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
    <button class="outline-btn" onclick="clearPlan()">Clear Plan</button>
    <button class="outline-btn" onclick="showPage('shop')">View Shopping List</button>
  </div>
</div>

<!-- SHOPPING PAGE -->
<div class="page" id="page-shop">
  <div class="shop-top">
    <div>
      <h1>Shopping List</h1>
      <p id="shop-subtitle">Based on your weekly meal plan.</p>
    </div>
    <div class="shop-top-btns">
      <button class="outline-btn" onclick="clearChecked()">Clear checked</button>
      <button class="outline-btn" onclick="copyList()">Copy list</button>
    </div>
  </div>
  <div class="prog-row">
    <div class="prog-track"><div class="prog-fill" id="shop-prog" style="width:0%"></div></div>
    <span class="prog-lbl" id="shop-prog-lbl">0 / 0 items</span>
  </div>
  <div id="shop-content"></div>
</div>

<!-- SAVED PAGE -->
<div class="page" id="page-saved">
  <div class="section-hdr" style="margin-bottom:20px">
    <h2>Saved Recipes</h2>
    <button class="link-btn" onclick="clearFavourites()">Clear all</button>
  </div>
  <div id="saved-content"></div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-nav">
      <button class="modal-back" onclick="closeModal()">&larr; Back</button>
      <div class="modal-nav-actions">
        <button class="modal-icon-btn" id="modal-fav-btn" onclick="modalToggleFav()" title="Save recipe">&#9825;</button>
        <button class="modal-icon-btn" onclick="modalAddToPlan()" title="Add to plan">+Plan</button>
      </div>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var RECIPES = [
  {
    id:'l001', meal:'lunch', name:'Smashed Cucumber Peanut Noodles',
    emoji:'&#x1F952;', cat:['vegetarian','vegan','quick','highProtein'],
    cook:15, prep:10, src:'Mob Kitchen',
    desc:'Silky rice noodles tossed in a punchy sesame-peanut dressing with smashed cucumber, spring onion and chilli. Ready in 15 minutes.',
    ings:[
      {q:'100g',n:'rice noodles'},{q:'1',n:'cucumber'},
      {q:'3 tbsp',n:'peanut butter'},{q:'2 tbsp',n:'soy sauce'},
      {q:'1 tbsp',n:'sesame oil'},{q:'1 tbsp',n:'rice vinegar'},
      {q:'2 cloves',n:'garlic, minced'},{q:'3',n:'spring onions'},
      {q:'1',n:'red chilli'},{q:'1 tbsp',n:'sesame seeds'},{q:'1',n:'lime'}
    ],
    steps:[
      'Cook rice noodles per packet instructions, drain and rinse cold.',
      'Smash cucumber with a rolling pin, tear into chunks, salt and leave 5 mins then drain.',
      'Whisk peanut butter, soy sauce, sesame oil, rice vinegar, garlic and lime juice.',
      'Toss noodles and cucumber in dressing. Top with spring onion, chilli and sesame seeds.'
    ],
    nutr:{cal:420,pro:14,carb:58,fat:16},
    shop:{Pantry:['rice noodles','peanut butter','soy sauce','sesame oil','rice vinegar','sesame seeds'],Produce:['cucumber','garlic','spring onions','red chilli','lime']}

var DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MEAL_TYPES = ['lunch','dinner'];

// STATE
var st = {
  servings: 2,
  activeFilter: 'all',
  prefs: [],
  plan: {},
  favourites: [],
  checked: {}
};
var openRecipeId = null;

try {
  var saved = localStorage.getItem('chefly_v2');
  if (saved) { var parsed = JSON.parse(saved); Object.assign(st, parsed); }
} catch(e) {}

function persist() {
  try { localStorage.setItem('chefly_v2', JSON.stringify(st)); } catch(e) {}
}

function byId(id) {
  for (var i = 0; i < RECIPES.length; i++) { if (RECIPES[i].id === id) return RECIPES[i]; }
  return null;
}
function isFav(id) { return st.favourites.indexOf(id) !== -1; }
function totalTime(r) { return r.cook + r.prep; }

// NAV
function showPage(page) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  var tabs = document.querySelectorAll('.nav-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  document.getElementById('page-' + page).classList.add('active');
  document.querySelector('[data-page="' + page + '"]').classList.add('active');
  if (page === 'shop') renderShop();
  if (page === 'saved') renderSaved();
  if (page === 'plan') renderPlan();
}

// TOAST
var toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
}

// SERVINGS
function changeServings(d) {
  st.servings = Math.max(1, Math.min(10, st.servings + d));
  document.getElementById('srv-num').textContent = st.servings;
  persist();
}

// FILTERS
function toggleFilter(btn, filter) {
  st.activeFilter = filter;
  var chips = document.querySelectorAll('#home-filters .filter-chip');
  for (var i = 0; i < chips.length; i++) { chips[i].classList.remove('on','on-green'); }
  btn.classList.add('on-green');
  renderGrids();
}

function togglePref(btn, pref) {
  var idx = st.prefs.indexOf(pref);
  if (idx === -1) st.prefs.push(pref);
  else st.prefs.splice(idx, 1);
  var chips = document.querySelectorAll('[data-pref]');
  for (var i = 0; i < chips.length; i++) {
    chips[i].classList.toggle('on', st.prefs.indexOf(chips[i].dataset.pref) !== -1);
  }
  persist();
}

function filteredRecipes(meal) {
  return RECIPES.filter(function(r) {
    if (r.meal !== meal) return false;
    if (st.activeFilter === 'all') return true;
    return r.cat.indexOf(st.activeFilter) !== -1;
  });
}

// RECIPE CARD
function recipeCard(r) {
  var fav = isFav(r.id);
  return '<div class="rcard" onclick="openRecipe(\'' + r.id + '\')">'
    + '<div class="rcard-top">'
    + '<span>' + r.emoji + '</span>'
    + '<button class="rcard-fav" onclick="event.stopPropagation();toggleFav(\'' + r.id + '\')">' + (fav ? '&#10084;' : '&#9825;') + '</button>'
    + '<span class="rcard-cat-dot">' + r.meal + '</span>'
    + '</div>'
    + '<div class="rcard-body">'
    + '<div class="rcard-name">' + r.name + '</div>'
    + '<div class="rcard-meta"><span>' + totalTime(r) + ' min</span><span>' + r.src + '</span></div>'
    + '<div class="rcard-desc">' + r.desc + '</div>'
    + '<div class="rcard-nutr">'
    + '<div class="nutr-pill"><span class="nutr-pill-val">' + r.nutr.cal + '</span><span class="nutr-pill-lbl">kcal</span></div>'
    + '<div class="nutr-pill"><span class="nutr-pill-val">' + r.nutr.pro + 'g</span><span class="nutr-pill-lbl">protein</span></div>'
    + '<div class="nutr-pill"><span class="nutr-pill-val">' + r.nutr.carb + 'g</span><span class="nutr-pill-lbl">carbs</span></div>'
    + '<div class="nutr-pill"><span class="nutr-pill-val">' + r.nutr.fat + 'g</span><span class="nutr-pill-lbl">fat</span></div>'
    + '</div>'
    + '</div>'
    + '</div>';
}

function renderGrids() {
  document.getElementById('grid-lunch').innerHTML = filteredRecipes('lunch').map(recipeCard).join('');
  document.getElementById('grid-dinner').innerHTML = filteredRecipes('dinner').map(recipeCard).join('');
}

// FAVOURITES
function toggleFav(id) {
  var idx = st.favourites.indexOf(id);
  if (idx === -1) { st.favourites.push(id); toast('Recipe saved!'); }
  else { st.favourites.splice(idx, 1); toast('Removed from saved'); }
  persist();
  updateFavBadge();
  renderGrids();
  renderSaved();
  if (openRecipeId === id) updateModalFavBtn();
}

function updateFavBadge() {
  var badge = document.getElementById('fav-badge');
  var count = st.favourites.length;
  badge.textContent = count;
  badge.style.display = count > 0 ? 'flex' : 'none';
}

function clearFavourites() {
  if (!st.favourites.length) return;
  st.favourites = [];
  persist();
  updateFavBadge();
  renderGrids();
  renderSaved();
  toast('Saved recipes cleared');
}

function renderSaved() {
  var el = document.getElementById('saved-content');
  if (!st.favourites.length) {
    el.innerHTML = '<div class="saved-empty"><div class="saved-empty-icon">&#9825;</div><h2>No saved recipes yet</h2><p>Tap the heart on any recipe to save it here.</p></div>';
    return;
  }
  var html = '<div class="saved-grid">';
  for (var i = 0; i < st.favourites.length; i++) {
    var r = byId(st.favourites[i]);
    if (r) html += recipeCard(r);
  }
  html += '</div>';
  el.innerHTML = html;
}

// PLAN
function planKey(dayIdx, mealType) { return dayIdx + '_' + mealType; }

function generatePlan() {
  var btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.textContent = 'Generating...';
  setTimeout(function() {
    for (var d = 0; d < 7; d++) {
      for (var m = 0; m < MEAL_TYPES.length; m++) {
        var mealType = MEAL_TYPES[m];
        var pool = RECIPES.filter(function(r) {
          if (r.meal !== mealType) return false;
          if (st.prefs.length === 0) return true;
          for (var p = 0; p < st.prefs.length; p++) { if (r.cat.indexOf(st.prefs[p]) !== -1) return true; }
          return false;
        });
        if (pool.length === 0) pool = RECIPES.filter(function(r) { return r.meal === mealType; });
        var pick = pool[Math.floor(Math.random() * pool.length)];
        st.plan[planKey(d, mealType)] = pick.id;
      }
    }
    persist();
    btn.disabled = false;
    btn.textContent = 'Regenerate Plan';
    renderPlan();
    toast('Meal plan generated!');
  }, 300);
}

function rerollSlot(dayIdx, mealType) {
  var pool = RECIPES.filter(function(r) {
    if (r.meal !== mealType) return false;
    if (st.prefs.length === 0) return true;
    for (var p = 0; p < st.prefs.length; p++) { if (r.cat.indexOf(st.prefs[p]) !== -1) return true; }
    return false;
  });
  if (pool.length === 0) pool = RECIPES.filter(function(r) { return r.meal === mealType; });
  var current = st.plan[planKey(dayIdx, mealType)];
  var pick = pool[0];
  if (pool.length > 1) {
    var tries = 0;
    do { pick = pool[Math.floor(Math.random() * pool.length)]; tries++; } while (pick.id === current && tries < 20);
  }
  st.plan[planKey(dayIdx, mealType)] = pick.id;
  persist();
  renderPlan();
  toast('Swapped!');
}

function removePlanSlot(key) {
  delete st.plan[key];
  persist();
  renderPlan();
}

function clearPlan() {
  st.plan = {};
  persist();
  renderPlan();
  toast('Plan cleared');
}

function getTodayIdx() {
  var d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
}

function renderPlan() {
  var today = getTodayIdx();
  var planned = Object.keys(st.plan).length;
  document.getElementById('plan-desc').textContent =
    planned > 0 ? planned + ' meal' + (planned !== 1 ? 's' : '') + ' planned this week.' : 'Plan your meals for the week ahead.';

  var chips = document.querySelectorAll('[data-pref]');
  for (var i = 0; i < chips.length; i++) {
    chips[i].classList.toggle('on', st.prefs.indexOf(chips[i].dataset.pref) !== -1);
  }

  var html = '';
  for (var d = 0; d < 7; d++) {
    html += '<div class="day-col">';
    html += '<div class="day-hdr' + (d === today ? ' today' : '') + '">' + DAYS[d] + '</div>';
    for (var m = 0; m < MEAL_TYPES.length; m++) {
      var mealType = MEAL_TYPES[m];
      var key = planKey(d, mealType);
      var rid = st.plan[key];
      var r = rid ? byId(rid) : null;
      if (!r) {
        html += '<div class="meal-slot empty"><div class="empty-slot-txt">' + mealType + '<br>&#8212;</div></div>';
      } else {
        var fav = isFav(r.id);
        html += '<div class="meal-slot" onclick="openRecipe(\'' + r.id + '\')">'
          + '<div class="meal-slot-emoji">' + r.emoji + '</div>'
          + '<div class="meal-slot-body">'
          + '<div class="meal-slot-type">' + mealType + '</div>'
          + '<div class="meal-slot-name">' + r.name + '</div>'
          + '</div>'
          + '<div class="meal-slot-actions" onclick="event.stopPropagation()">'
          + '<button class="slot-btn" onclick="toggleFav(\'' + r.id + '\')" title="Save">' + (fav ? '&#10084;' : '&#9825;') + '</button>'
          + '<button class="slot-btn" onclick="rerollSlot(' + d + ',\'' + mealType + '\')" title="Swap">&#x21BA;</button>'
          + '<button class="slot-btn" onclick="removePlanSlot(\'' + key + '\')" title="Remove">&#x2715;</button>'
          + '</div></div>';
      }
    }
    html += '</div>';
  }
  document.getElementById('week-grid').innerHTML = html;
}

// SHOPPING
function buildShopList() {
  var ids = [];
  var vals = Object.values ? Object.values(st.plan) : Object.keys(st.plan).map(function(k){return st.plan[k];});
  vals.forEach(function(id) { if (ids.indexOf(id) === -1) ids.push(id); });
  var recipes = ids.map(byId).filter(Boolean);
  if (!recipes.length) return null;
  var cats = {};
  recipes.forEach(function(r) {
    Object.keys(r.shop).forEach(function(cat) {
      if (!cats[cat]) cats[cat] = {};
      r.shop[cat].forEach(function(item) {
        cats[cat][item] = (cats[cat][item] || 0) + 1;
      });
    });
  });
  return {cats: cats, recipes: recipes};
}

function renderShop() {
  var el = document.getElementById('shop-content');
  var data = buildShopList();
  if (!data) {
    el.innerHTML = '<div class="shop-empty"><div class="shop-empty-icon">&#x1F6D2;</div><p>Add meals to your plan first, then your shopping list will appear here.</p></div>';
    document.getElementById('shop-subtitle').textContent = 'Based on your weekly meal plan.';
    document.getElementById('shop-prog').style.width = '0%';
    document.getElementById('shop-prog-lbl').textContent = '0 / 0 items';
    return;
  }
  document.getElementById('shop-subtitle').textContent =
    data.recipes.length + ' recipe' + (data.recipes.length !== 1 ? 's' : '') + ' in your plan';

  var total = 0, done = 0;
  Object.keys(data.cats).forEach(function(cat) {
    Object.keys(data.cats[cat]).forEach(function(item) {
      total++;
      if (st.checked[item]) done++;
    });
  });
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('shop-prog').style.width = pct + '%';
  document.getElementById('shop-prog-lbl').textContent = done + ' / ' + total + ' items';

  var html = '<div class="shop-cats">';
  Object.keys(data.cats).sort().forEach(function(cat) {
    var items = Object.keys(data.cats[cat]);
    var catDone = items.filter(function(i) { return st.checked[i]; }).length;
    html += '<div class="shop-cat">';
    html += '<div class="shop-cat-hdr"><span>' + cat + '</span><span class="shop-cat-count">' + catDone + '/' + items.length + '</span></div>';
    html += '<ul class="shop-items">';
    items.forEach(function(item) {
      var isDone = !!st.checked[item];
      var times = data.cats[cat][item];
      var safeItem = item.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += '<li class="shop-item' + (isDone ? ' done' : '') + '" onclick="toggleCheck(\'' + safeItem + '\')">'
        + '<div class="chkbox' + (isDone ? ' on' : '') + '">' + (isDone ? '&#10003;' : '') + '</div>'
        + '<span class="shop-item-name">' + item + '</span>'
        + (times > 1 ? '<span class="shop-item-qty">x' + times + '</span>' : '')
        + '</li>';
    });
    html += '</ul></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function toggleCheck(item) {
  if (st.checked[item]) delete st.checked[item];
  else st.checked[item] = true;
  persist();
  renderShop();
}

function clearChecked() {
  st.checked = {};
  persist();
  renderShop();
  toast('Checks cleared');
}

function copyList() {
  var data = buildShopList();
  if (!data) { toast('No shopping list yet'); return; }
  var text = 'Shopping List\n\n';
  Object.keys(data.cats).sort().forEach(function(cat) {
    text += cat + ':\n';
    Object.keys(data.cats[cat]).forEach(function(item) { text += '  - ' + item + '\n'; });
    text += '\n';
  });
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast('Copied!'); }).catch(function() { toast('Copy failed'); });
  } else { toast('Copy not supported in this browser'); }
}

// MODAL
function openRecipe(id) {
  var r = byId(id);
  if (!r) return;
  openRecipeId = id;
  updateModalFavBtn();

  var ingHtml = r.ings.map(function(i) {
    return '<li class="ing-item"><div class="ing-dot"></div><span class="ing-qty">' + i.q + '</span><span class="ing-name">' + i.n + '</span></li>';
  }).join('');

  var stepsHtml = r.steps.map(function(s, idx) {
    return '<li class="step-item"><div class="step-n">' + (idx+1) + '</div><span>' + s + '</span></li>';
  }).join('');

  document.getElementById('modal-content').innerHTML =
    '<div class="modal-emoji">' + r.emoji + '</div>'
    + '<div class="modal-body">'
    + '<div class="modal-cat">' + r.meal.toUpperCase() + ' &bull; ' + r.cat.join(' &bull; ') + '</div>'
    + '<div class="modal-title">' + r.name + '</div>'
    + '<div class="modal-stats">'
    + '<span class="modal-stat">&#9200; ' + totalTime(r) + ' min total</span>'
    + '<span class="modal-stat">Prep: ' + r.prep + 'min</span>'
    + '<span class="modal-stat">Cook: ' + r.cook + 'min</span>'
    + '<span class="modal-stat">' + r.src + '</span>'
    + '</div>'
    + '<p class="modal-desc">' + r.desc + '</p>'
    + '<div class="nutr-grid">'
    + '<div class="nutr-box"><span class="nutr-box-val">' + r.nutr.cal + '</span><span class="nutr-box-lbl">calories</span></div>'
    + '<div class="nutr-box"><span class="nutr-box-val">' + r.nutr.pro + 'g</span><span class="nutr-box-lbl">protein</span></div>'
    + '<div class="nutr-box"><span class="nutr-box-val">' + r.nutr.carb + 'g</span><span class="nutr-box-lbl">carbs</span></div>'
    + '<div class="nutr-box"><span class="nutr-box-val">' + r.nutr.fat + 'g</span><span class="nutr-box-lbl">fat</span></div>'
    + '</div>'
    + '<div class="modal-cols">'
    + '<div class="modal-section"><h3>Ingredients <span>for ' + st.servings + ' serving' + (st.servings!==1?'s':'') + '</span></h3><ul class="ing-list">' + ingHtml + '</ul></div>'
    + '<div class="modal-section"><h3>Method</h3><ol class="steps-list">' + stepsHtml + '</ol></div>'
    + '</div>'
    + '<button class="add-plan-btn" onclick="modalAddToPlan()">Add to Plan</button>'
    + '</div>';

  document.getElementById('overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.add('hidden');
  document.body.style.overflow = '';
  openRecipeId = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

function updateModalFavBtn() {
  if (!openRecipeId) return;
  var fav = isFav(openRecipeId);
  var btn = document.getElementById('modal-fav-btn');
  btn.textContent = fav ? '\u2764' : '\u2661';
  btn.style.color = fav ? '#e53935' : '';
}

function modalToggleFav() {
  if (openRecipeId) toggleFav(openRecipeId);
}

function modalAddToPlan() {
  if (!openRecipeId) return;
  var r = byId(openRecipeId);
  var placed = false;
  for (var d = 0; d < 7; d++) {
    var key = planKey(d, r.meal);
    if (!st.plan[key]) {
      st.plan[key] = r.id;
      placed = true;
      persist();
      toast('Added to ' + DAYS[d] + '!');
      renderPlan();
      break;
    }
  }
  if (!placed) toast('All ' + r.meal + ' slots are filled');
  closeModal();
  showPage('plan');
}

// INIT
document.getElementById('srv-num').textContent = st.servings;
updateFavBadge();
renderGrids();
renderPlan();
</script>
</body>
</html>
