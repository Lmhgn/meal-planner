<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chefly — Weekly Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#edf0e8;--white:#ffffff;--green:#38a83b;--green-light:#f0fdf4;--green-border:#d1fae5;
  --dark:#111827;--muted:#6b7280;--light:#9ca3af;--border:#e5e7eb;--border2:#f3f4f6;
  --shadow:0 2px 8px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.1);--shadow-lg:0 12px 32px rgba(0,0,0,0.12);
  --radius:16px;--radius-sm:10px;--radius-xs:8px;--radius-full:999px;
  --font:'Inter',system-ui,sans-serif;--font-display:'Playfair Display',Georgia,serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--dark);min-height:100vh;-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;outline:none;font-family:var(--font)}
input,textarea{font-family:var(--font);outline:none;border:none}
a{text-decoration:none;color:inherit}
img{display:block}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:10px}
.logo-box{width:36px;height:36px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;font-weight:800;flex-shrink:0}
.brand{font-size:18px;font-weight:700;color:var(--dark)}
.nav-links{display:flex;gap:32px;margin-left:32px}
.nav-link{font-size:14px;font-weight:500;color:var(--muted);transition:color .15s;cursor:pointer}
.nav-link.active{color:var(--green);font-weight:600}
.nav-link:hover{color:var(--dark)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-full);padding:8px 16px;width:220px}
.nav-search input{background:transparent;font-size:14px;color:var(--dark);width:100%}
.nav-search input::placeholder{color:var(--light)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);cursor:pointer;overflow:hidden;border:2px solid var(--border)}
.avatar-img{width:100%;height:100%;object-fit:cover}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:40px 24px 100px}
.main-wide{max-width:1200px;margin:0 auto;padding:32px 24px 100px}

/* HERO */
.hero{margin-bottom:32px}
.hero h1{font-size:32px;font-weight:800;color:var(--dark);margin-bottom:6px}
.hero p{font-size:15px;color:var(--muted)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.chip{padding:9px 18px;border-radius:var(--radius-full);background:var(--white);border:1.5px solid var(--border);font-size:14px;font-weight:500;color:var(--dark);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:#aaa}
.chip.active{background:var(--dark);color:white;border-color:var(--dark)}
.chip.active-green{background:var(--green);color:white;border-color:var(--green)}

/* SECTION HEADER */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.section-hdr h2{font-size:20px;font-weight:700;color:var(--dark)}
.view-all{font-size:14px;font-weight:600;color:var(--green);cursor:pointer;display:flex;align-items:center;gap:4px}
.view-all:hover{text-decoration:underline}

/* RECIPE GRID */
.recipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}

/* RECIPE CARD (home) */
.rcard{background:var(--white);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:all .2s}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.rcard-img-wrap{position:relative;height:200px;overflow:hidden;background:#e5e7eb}
.rcard-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.rcard:hover .rcard-img-wrap img{transform:scale(1.04)}
.rcard-fav{position:absolute;top:12px;right:12px;width:32px;height:32px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.15);transition:all .15s;z-index:1}
.rcard-fav:hover{transform:scale(1.15)}
.rcard-fav.saved{color:#ef4444}
.rcard-badge{position:absolute;bottom:12px;left:12px;background:var(--dark);color:white;font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;letter-spacing:.05em;text-transform:uppercase}
.rcard-body{padding:14px 16px 16px}
.rcard-cat{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rcard-cat-label{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.rcard-dot{width:4px;height:4px;border-radius:50%;background:var(--light)}
.rcard-time{font-size:12px;color:var(--muted)}
.rcard-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.3}
.rcard-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* INGREDIENT BUBBLES */
.ingr-section{margin-bottom:40px}
.ingr-bubbles{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px}
.ingr-bubble{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.ingr-img{width:72px;height:72px;border-radius:50%;overflow:hidden;background:#e5e7eb}
.ingr-img img{width:100%;height:100%;object-fit:cover}
.ingr-name{font-size:13px;font-weight:500;color:var(--dark)}

/* PLAN PAGE */
.plan-hero{margin-bottom:32px}
.plan-hero h1{font-size:28px;font-weight:800;color:var(--dark);margin-bottom:6px}
.plan-hero p{font-size:15px;color:var(--muted)}
.plan-search-box{background:var(--white);border-radius:var(--radius);padding:6px 6px 6px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:20px;border:1.5px solid var(--border)}
.plan-search-box input{flex:1;font-size:15px;color:var(--dark);padding:10px 0}
.plan-search-box input::placeholder{color:var(--light)}
.find-btn{padding:14px 28px;background:var(--green);color:white;border-radius:var(--radius-sm);font-size:15px;font-weight:700;white-space:nowrap;transition:background .15s;flex-shrink:0}
.find-btn:hover{background:#2d8f30}
.servings-row{background:var(--white);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:24px;border:1.5px solid var(--border)}
.srv-icon{font-size:20px}
.srv-label{flex:1;font-size:15px;font-weight:500;color:var(--dark)}
.srv-input{width:56px;border:1.5px solid var(--border);border-radius:var(--radius-xs);padding:8px 12px;font-size:16px;font-weight:600;text-align:center;color:var(--dark)}
.srv-unit{font-size:15px;color:var(--muted)}
.pref-section{margin-bottom:24px}
.pref-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--dark);margin-bottom:12px}

/* WEEK PLANNER */
.week-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.week-hdr-left h1{font-size:26px;font-weight:800;color:var(--dark);margin-bottom:4px}
.week-hdr-left p{font-size:14px;color:var(--muted)}
.week-hdr-btns{display:flex;gap:10px;align-items:center}
.btn-green{display:flex;align-items:center;gap:8px;padding:12px 22px;background:var(--green);color:white;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:background .15s}
.btn-green:hover{background:#2d8f30}
.btn-outline{display:flex;align-items:center;gap:8px;padding:12px 22px;background:var(--white);color:var(--dark);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .15s}
.btn-outline:hover{border-color:var(--dark);background:var(--bg)}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.day-hdr{padding:10px 8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--white);border-radius:var(--radius-xs)}
.day-hdr.today{background:var(--green);color:white}
.week-meals{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.meal-card{background:var(--white);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:all .18s}
.meal-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.meal-card-img{width:100%;height:110px;object-fit:cover;background:#e5e7eb;display:block}
.meal-card-body{padding:8px 10px 10px}
.meal-card-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.meal-card-name{font-size:12px;font-weight:600;color:var(--dark);line-height:1.3}
.meal-card-actions{display:flex;gap:4px;margin-top:6px}
.meal-icon-btn{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;transition:background .15s;cursor:pointer;border:none}
.meal-icon-btn:hover{background:var(--border)}

/* SHOPPING */
.shop-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.shop-hdr h1{font-size:24px;font-weight:800;color:var(--dark);margin-bottom:4px}
.shop-hdr p{font-size:14px;color:var(--muted)}
.shop-hdr-btns{display:flex;gap:8px}
.shop-section{background:var(--white);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.shop-cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border2)}
.shop-cat-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item-badge{background:var(--green-light);color:var(--green);border:1px solid var(--green-border);font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-full)}
.shop-item{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border2)}
.shop-item:last-child{border-bottom:none}
.shop-item:hover{background:var(--bg)}
.shop-item.done{opacity:.5}
.shop-item.done .shop-item-name{text-decoration:line-through}
.g-chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:12px;color:white}
.g-chk.checked{background:var(--green);border-color:var(--green)}
.shop-item-name{flex:1;font-size:14px;color:var(--dark)}
.shop-item-qty{font-size:13px;color:var(--muted);font-weight:500}
.shop-end{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;color:var(--light)}
.shop-end-icon{width:64px;height:64px;border-radius:50%;background:var(--border2);display:flex;align-items:center;justify-content:center;font-size:28px}
.shop-end-text{font-size:14px}
.add-item-btn{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:600px;padding:16px;background:var(--green);color:white;border-radius:var(--radius);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(56,168,59,.35);transition:background .15s}
.add-item-btn:hover{background:#2d8f30}

/* RECIPE MODAL */
.recipe-overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:200;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.recipe-page-nav{background:var(--white);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.recipe-page-nav-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s}
.icon-btn:hover{background:var(--border)}
.icon-btn.saved{color:#ef4444}
.recipe-content{max-width:860px;margin:0 auto;padding:32px 24px 80px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:20px}
.breadcrumb a{color:var(--green);cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.recipe-title-wrap{border-left:5px solid var(--green);padding-left:20px;margin-bottom:24px}
.recipe-title{font-family:var(--font-display);font-size:42px;font-weight:800;line-height:1.1;color:var(--dark)}
.recipe-title .green-word{color:var(--green)}
.recipe-stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px}
.recipe-stat{display:flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--border);padding:8px 14px;border-radius:var(--radius-full);font-size:13px;font-weight:500;color:var(--dark)}
.recipe-stat-icon{font-size:14px}
.recipe-stat-star{color:#f59e0b}
.recipe-body{display:grid;grid-template-columns:1fr 1.2fr;gap:32px;margin-bottom:32px}
.recipe-ing-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.recipe-ing-hdr h2{font-size:18px;font-weight:700;color:var(--dark)}
.recipe-ing-count{font-size:14px;color:var(--muted)}
.ing-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2)}
.ing-item:last-child{border-bottom:none}
.ing-chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;transition:all .15s;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:white}
.ing-chk.checked{background:var(--green);border-color:var(--green)}
.ing-text{font-size:14px;color:var(--dark);line-height:1.4}
.ing-note{font-size:12px;color:var(--muted);font-style:italic}
.add-cart-btn{margin-top:20px;width:100%;padding:13px;background:var(--green);color:white;border-radius:var(--radius-sm);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.add-cart-btn:hover{background:#2d8f30}
.recipe-steps-hdr{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.recipe-steps-hdr h2{font-size:18px;font-weight:700;color:var(--dark)}
.step-item{display:flex;gap:14px;margin-bottom:20px}
.step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--green);color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step-text{font-size:14px;color:var(--dark);line-height:1.7;padding-top:3px}
.nutr-card{background:var(--white);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.nutr-card h3{font-size:18px;font-weight:700;color:var(--dark);margin-bottom:20px}
.nutr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.nutr-stat{text-align:center}
.nutr-val{display:block;font-size:28px;font-weight:800;color:var(--dark);font-family:var(--font-display)}
.nutr-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.chefs-tip{background:var(--green-light);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.chefs-tip-hdr{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--dark);margin-bottom:8px}
.chefs-tip-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0}
.chefs-tip p{font-size:14px;color:var(--muted);line-height:1.7}
.recipe-footer{text-align:center;padding:32px 24px;border-top:1px solid var(--border);margin-top:40px}
.recipe-footer-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.recipe-footer p{font-size:13px;color:var(--muted)}

/* SAVED PAGE */
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.empty-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;text-align:center}
.empty-icon{font-size:64px;margin-bottom:16px}
.empty-title{font-size:24px;font-weight:700;color:var(--dark);margin-bottom:8px}
.empty-sub{font-size:15px;color:var(--muted);max-width:360px;line-height:1.6}
.empty-sub strong{color:var(--green)}

/* PROGRESS BAR */
.prog-wrap{background:var(--white);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.prog-track{flex:1;height:8px;background:var(--border2);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.prog-label{font-size:13px;color:var(--muted);white-space:nowrap}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;padding:8px 0 env(safe-area-inset-bottom, 12px);z-index:100}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;cursor:pointer;color:var(--light);transition:color .15s}
.bnav-item.active{color:var(--green)}
.bnav-icon{font-size:20px;line-height:1}

/* SITE FOOTER */
.site-footer{background:var(--white);border-top:1px solid var(--border);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.site-footer-left{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.site-footer-right{display:flex;gap:24px}
.site-footer-right a{font-size:14px;color:var(--muted);cursor:pointer}
.site-footer-right a:hover{color:var(--green)}

/* RESPONSIVE */
@media(max-width:900px){
  .recipe-grid{grid-template-columns:repeat(2,1fr)}
  .week-days,.week-meals{grid-template-columns:repeat(4,1fr)}
  .nav-links{display:none}
  .nav-search{display:none}
  .recipe-body{grid-template-columns:1fr}
  .nutr-stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .recipe-grid{grid-template-columns:1fr}
  .week-days,.week-meals{grid-template-columns:repeat(2,1fr)}
  .main,.main-wide{padding:24px 16px 90px}
  .recipe-title{font-size:30px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useEffect} = React;
