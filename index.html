<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weekly Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f14;--surface:#1a1a24;--surface2:#22222f;--surface3:#2a2a3a;
  --border:rgba(255,255,255,0.08);--border-hover:rgba(255,255,255,0.16);
  --text:#f0f0f5;--text-muted:#8888aa;
  --accent:#7c6af7;--accent-light:#9d8fff;--accent-dim:rgba(124,106,247,0.15);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.12);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --teal:#2dd4bf;--teal-dim:rgba(45,212,191,0.12);
  --pink:#f472b6;--pink-dim:rgba(244,114,182,0.12);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);--shadow-lg:0 8px 40px rgba(0,0,0,0.6);
  --font:'Inter',system-ui,sans-serif;--font-display:'Playfair Display',Georgia,serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
button{cursor:pointer;border:none;outline:none;font-family:var(--font)}
input,textarea{font-family:var(--font);outline:none}
a{text-decoration:none;color:inherit}
/* LAYOUT */
.app{min-height:100vh;display:flex;flex-direction:column}
.main-layout{display:flex;flex:1;max-width:1600px;margin:0 auto;width:100%;padding-bottom:60px}
.sidebar{width:300px;min-width:300px;padding:24px 16px 24px 24px;position:sticky;top:72px;height:calc(100vh - 72px);overflow-y:auto}
.content{flex:1;padding:24px 24px 24px 8px;min-width:0}
/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:72px}
.header-logo{display:flex;align-items:center;gap:14px}
.logo-icon{font-size:32px;line-height:1}
.header-title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.header-subtitle{font-size:12px;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase}
.header-meta{display:flex;gap:8px;flex-wrap:wrap}
.header-badge{background:var(--accent-dim);color:var(--accent-light);border:1px solid rgba(124,106,247,0.3);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500}
/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--surface);border-radius:var(--radius-sm);padding:4px;width:fit-content}
.tab-btn{position:relative;padding:10px 22px;border-radius:var(--radius-xs);background:transparent;color:var(--text-muted);font-size:14px;font-weight:500;transition:all .2s;letter-spacing:.01em}
.tab-btn:hover{color:var(--text);background:var(--surface2)}
.tab-btn.active{background:var(--accent);color:white}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--pink);color:white;border-radius:999px;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;margin-right:6px}
/* FILTER PANEL */
.filter-panel{display:flex;flex-direction:column;gap:16px}
.filter-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.filter-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.filter-section-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.clear-btn{background:none;color:var(--accent-light);font-size:12px;padding:2px 8px;border-radius:var(--radius-xs);transition:background .2s}
.clear-btn:hover{background:var(--accent-dim)}
.servings-control{display:flex;align-items:center;gap:16px;justify-content:center;padding:4px 0}
.servings-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .2s;line-height:1}
.servings-btn:hover{background:var(--accent)}
.servings-display{text-align:center;min-width:60px}
.servings-num{display:block;font-size:28px;font-weight:700;font-family:var(--font-display);color:var(--accent-light);line-height:1}
.servings-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.ingredient-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;font-size:14px;resize:vertical;transition:border-color .2s}
.ingredient-input:focus{border-color:var(--accent)}
.ingredient-input::placeholder{color:var(--text-muted)}
.ingredient-hint{margin-top:8px;font-size:12px;color:var(--text-muted);line-height:1.5}
.ingredient-hint strong{color:var(--teal)}
.filter-grid{display:flex;flex-direction:column;gap:6px}
.filter-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);text-align:left;transition:all .2s;font-size:13px}
.filter-chip:hover{border-color:var(--border-hover);color:var(--text)}
.filter-chip.active{background:var(--accent-dim);border-color:rgba(124,106,247,0.4);color:var(--accent-light)}
.chip-icon{font-size:15px;flex-shrink:0}
.chip-label{font-weight:500}
.filter-actions{display:flex;flex-direction:column;gap:8px}
.generate-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),#9d60f7);color:white;font-size:15px;font-weight:600;transition:all .2s;box-shadow:0 4px 20px rgba(124,106,247,0.4)}
.generate-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(124,106,247,0.5)}
.generate-btn:active{transform:translateY(0)}
.clear-all-btn{background:none;color:var(--text-muted);font-size:13px;padding:8px;border-radius:var(--radius-xs);transition:color .2s;text-align:center;width:100%}
.clear-all-btn:hover{color:var(--text)}
.filter-tip{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.filter-tip p{font-size:12px;color:var(--text-muted);line-height:1.6}
.filter-tip strong{color:var(--amber)}
/* EMPTY STATE */
.empty-state{display:flex;align-items:center;justify-content:center;min-height:480px;padding:40px 20px}
.empty-state-inner{text-align:center;max-width:420px}
.empty-emoji{font-size:64px;display:block;margin-bottom:20px}
.empty-title{font-family:var(--font-display);font-size:28px;font-weight:700;margin-bottom:12px;color:var(--text)}
.empty-desc{color:var(--text-muted);font-size:15px;line-height:1.7;margin-bottom:28px}
.empty-desc strong{color:var(--accent-light)}
.empty-cta{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),#9d60f7);color:white;font-size:15px;font-weight:600;box-shadow:0 4px 20px rgba(124,106,247,0.4);transition:all .2s}
.empty-cta:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(124,106,247,0.5)}
/* WEEK GRID */
.week-grid-header{margin-bottom:20px}
.week-grid-title{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.week-grid-sub{color:var(--text-muted);font-size:14px}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day-label{text-align:center;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 0 10px}
.day-meals{display:flex;flex-direction:column;gap:8px}
.meal-type-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 0 5px 2px}
.meal-type-label.lunch{color:var(--amber)}
.meal-type-label.dinner{color:var(--accent-light)}
/* RECIPE CARD */
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.recipe-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:var(--shadow)}
.recipe-card.empty{cursor:default;padding:20px;align-items:center;justify-content:center;min-height:100px}
.recipe-card.empty:hover{transform:none;box-shadow:none}
.empty-label{color:var(--text-muted);font-size:12px;text-align:center}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0}
.card-emoji{font-size:26px;line-height:1}
.card-header-actions{display:flex;gap:4px}
.fav-btn,.reroll-btn{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text-muted)}
.fav-btn:hover{background:var(--pink-dim);color:var(--pink)}
.fav-btn.active{background:var(--pink-dim);color:var(--pink)}
.reroll-btn{font-size:11px}
.reroll-btn:hover{background:var(--accent-dim)}
.card-body{padding:8px 10px 12px;flex:1;display:flex;flex-direction:column;gap:5px}
.card-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.card-source{font-size:11px;color:var(--accent-light)}
.card-source a:hover{text-decoration:underline}
.card-tags{display:flex;flex-wrap:wrap;gap:3px}
.card-tag{font-size:10px;font-weight:500;padding:2px 5px;border-radius:3px}
.card-meta{display:flex;gap:8px;font-size:11px;color:var(--text-muted)}
.card-nutrition{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-top:2px}
.nutr-pill{border-radius:5px;padding:3px 5px;display:flex;flex-direction:column;align-items:center}
.nutr-pill-val{font-size:11px;font-weight:700;line-height:1.2}
.nutr-pill-lbl{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border-hover);border-radius:20px;max-width:700px;width:100%;max-height:92vh;overflow-y:auto;position:relative;box-shadow:var(--shadow-lg);animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-close-btn{position:sticky;top:12px;float:right;width:32px;height:32px;background:var(--surface2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted);cursor:pointer;margin:12px 12px 0 0;transition:all .15s;z-index:1;border:none}
.modal-close-btn:hover{background:var(--red-dim);color:var(--red)}
.modal-hero{display:flex;gap:16px;align-items:flex-start;padding:8px 24px 0}
.modal-emoji{font-size:52px;line-height:1;flex-shrink:0}
.modal-hero-info{flex:1;min-width:0}
.modal-meal-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px}
.modal-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:4px}
.modal-source{font-size:13px;color:var(--accent-light);margin-bottom:8px}
.modal-source a:hover{text-decoration:underline}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px}
.modal-fav-btn{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:var(--surface2);font-size:20px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:all .15s;border:none;cursor:pointer}
.modal-fav-btn:hover,.modal-fav-btn.active{background:var(--pink-dim);color:var(--pink)}
.modal-stats{display:flex;gap:0;margin:16px 24px;background:var(--surface2);border-radius:var(--radius);padding:4px}
.modal-stat{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 4px;border-radius:var(--radius-sm)}
.stat-icon{font-size:16px}
.stat-val{font-size:15px;font-weight:700;color:var(--text);line-height:1.1}
.stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.modal-desc{padding:0 24px 16px;font-size:14px;color:var(--text-muted);line-height:1.7;border-bottom:1px solid var(--border)}
.modal-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.modal-section{padding:18px 24px;border-bottom:1px solid var(--border)}
.modal-section:nth-child(odd){border-right:1px solid var(--border)}
.modal-section.full{grid-column:1/-1}
.modal-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:4px}
.modal-section-sub{font-size:12px;color:var(--accent-light);margin-bottom:10px}
.ingredient-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.ingredient-item{display:flex;align-items:flex-start;gap:8px;font-size:13px}
.ing-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px}
.ing-qty{color:var(--accent-light);font-weight:600;white-space:nowrap}
.ing-name{color:var(--text)}
.ing-unit{color:var(--text-muted);font-size:12px}
.per-srv{font-size:10px;background:var(--accent-dim);color:var(--accent-light);padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.steps-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.step-item{display:flex;gap:10px;align-items:flex-start}
.step-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step-text{font-size:13px;color:var(--text-muted);line-height:1.6;flex:1}
.nutr-section{display:flex;gap:20px;align-items:flex-start}
.cal-box{text-align:center;background:var(--surface2);border-radius:var(--radius);padding:16px 18px;flex-shrink:0}
.cal-num{display:block;font-family:var(--font-display);font-size:38px;font-weight:700;color:var(--amber);line-height:1}
.cal-lbl{font-size:12px;color:var(--text-muted)}
.nutr-bars{flex:1;display:flex;flex-direction:column;gap:10px}
.nutr-row-hdr{display:flex;justify-content:space-between;margin-bottom:3px}
.nutr-name{font-size:12px;color:var(--text-muted)}
.nutr-val{font-size:12px;font-weight:600}
.nutr-bg{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.nutr-fill{height:100%;border-radius:3px;transition:width .5s ease}
/* SHOPPING LIST */
.shopping-list{max-width:960px}
.shopping-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.shopping-title{font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:4px}
.shopping-sub{font-size:14px;color:var(--text-muted)}
.shopping-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy-btn{padding:8px 16px;border-radius:var(--radius-sm);background:var(--accent);color:white;font-size:13px;font-weight:600;transition:all .2s;border:none;cursor:pointer}
.copy-btn:hover{background:var(--accent-light)}
.clear-chk-btn{padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface2);color:var(--text-muted);font-size:13px;transition:all .2s;border:1px solid var(--border);cursor:pointer}
.clear-chk-btn:hover{color:var(--text);border-color:var(--border-hover)}
.prog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prog-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .3s ease}
.prog-lbl{font-size:12px;color:var(--text-muted);min-width:55px}
.meal-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:20px}
.meal-summary-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:8px}
.meal-summary-tags{display:flex;flex-wrap:wrap;gap:5px}
.meal-tag{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:3px 9px;border-radius:var(--radius-xs)}
.shop-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.shop-cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cat-title{font-size:13px;font-weight:700;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.shop-items{list-style:none;padding:6px;display:flex;flex-direction:column;gap:1px}
.shop-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--radius-xs);cursor:pointer;transition:background .15s;user-select:none}
.shop-item:hover{background:var(--surface2)}
.shop-item.checked{opacity:.4}
.shop-item.checked .shop-item-name{text-decoration:line-through}
.chkbox{width:17px;height:17px;border-radius:4px;border:2px solid var(--border-hover);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:white;transition:all .15s}
.chkbox.ticked{background:var(--accent);border-color:var(--accent)}
.shop-item-name{flex:1;font-size:13px;color:var(--text)}
.shop-item-qty{font-size:12px;color:var(--text-muted);font-weight:500;white-space:nowrap;text-align:right;min-width:55px}
.shop-note{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:12px;color:var(--text-muted);line-height:1.6}
/* FAVOURITES */
.fav-header{margin-bottom:22px}
.fav-title{font-family:var(--font-display);font-size:24px;font-weight:700;margin-bottom:4px}
.fav-sub{font-size:14px;color:var(--text-muted)}
.fav-section{margin-bottom:28px}
.fav-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:12px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fav-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .2s}
.fav-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:var(--shadow)}
.fav-emoji{font-size:32px;flex-shrink:0}
.fav-body{flex:1;min-width:0}
.fav-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.fav-src{font-size:12px;color:var(--accent-light);margin-bottom:4px}
.fav-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text-muted)}
.fav-remove{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--pink-dim);color:var(--pink);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;border:none;cursor:pointer}
.fav-remove:hover{background:var(--pink);color:white}
/* RESPONSIVE */
@media(max-width:1100px){.days-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){
  .main-layout{flex-direction:column}
  .sidebar{width:100%;min-width:unset;position:static;height:auto;padding:16px}
  .content{padding:0 16px 16px}
  .days-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  .header-meta{display:none}
  .days-grid{grid-template-columns:1fr 1fr;overflow-x:auto}
  .modal-body{grid-template-columns:1fr}
  .modal-section:nth-child(odd){border-right:none}
  .modal-section.full{grid-column:1}
  .nutr-section{flex-direction:column}
}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function fmtQty(qty) {
  if (!qty) return '';
  return Number.isInteger(qty) ? String(qty) : parseFloat(qty.toFixed(1)).toString();
}

function filterRecipes(recipes, filters, ingredientText) {
  let filtered = [...recipes];
  const active = Object.entries(filters).filter(([,v])=>v).map(([k])=>k);
  if (active.length > 0) filtered = filtered.filter(r => active.some(c => r.category.includes(c)));
  if (ingredientText.trim()) {
    const terms = ingredientText.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
    filtered = filtered.filter(r => terms.some(t => r.ingredients.some(i => i.item.toLowerCase().includes(t))));
  }
  return filtered;
}

function generateWeekPlan(filters, ingredientText) {
  const shuffle = arr => [...arr].sort(()=>Math.random()-0.5);
  const lunches = filterRecipes(RECIPES.filter(r=>r.meal==='lunch'), filters, ingredientText);
  const dinners = filterRecipes(RECIPES.filter(r=>r.meal==='dinner'), filters, ingredientText);
  const sl = shuffle(lunches.length ? lunches : RECIPES.filter(r=>r.meal==='lunch'));
  const sd = shuffle(dinners.length ? dinners : RECIPES.filter(r=>r.meal==='dinner'));
  return DAYS.map((day,i)=>({day, lunch:sl[i%sl.length]||null, dinner:sd[i%sd.length]||null}));
}

function buildShoppingList(weekPlan, servings) {
  const totals = {};
  weekPlan.forEach(({lunch,dinner}) => {
    [lunch,dinner].forEach(recipe => {
      if (!recipe) return;
      recipe.ingredients.forEach(ing => {
        const key = ing.item.toLowerCase() + '__' + ing.unit;
        const qty = ing.perServing ? ing.qty * servings : ing.qty;
        if (!totals[key]) totals[key] = {item:ing.item, qty:0, unit:ing.unit};
        totals[key].qty += qty;
      });
    });
  });
  const cats = [
    {label:'🥩 Meat & Fish', test: s => /chicken|beef|lamb|pork|prawn|salmon|tuna|sea bass|chorizo|mince|anchov/.test(s)},
    {label:'🥛 Dairy & Eggs', test: s => /egg|butter|cream|yoghurt|milk|parmesan|feta|halloumi|cheese/.test(s)},
    {label:'🥦 Fresh Produce', test: s => /spinach|lettuce|rocket|kale|pak choi|spring onion|coriander|parsley|basil|thyme|rosemary|dill|sage|chilli|ginger|lemon|lime|orange|avocado|tomato|cucumber|courgette|pepper|onion|beetroot|broccoli|bean|pea|mango|squash|potato|carrot|celery|mushroom/.test(s)},
    {label:'🫙 Tinned & Jarred', test: s => /tinned|beans|chickpea|lentil|tomato pur|pesto|kimchi|capers|olives|jalape|gochujang|miso|hoisin|fish sauce|curry paste|coconut milk/.test(s)},
    {label:'🌾 Grains, Pasta & Rice', test: s => /rice|pasta|noodle|orzo|spaghetti|bulgur|arborio|bread|tortilla|pita|flatbread|naan|soba/.test(s)},
    {label:'🫒 Oils, Condiments & Spices', test: s => /oil|vinegar|mustard|honey|sugar|cumin|coriander|paprika|turmeric|masala|spice|sumac|five.spice|cinnamon|chocolate|wine|stock|mirin|tahini|sesame seed|pine nut|walnut|pumpkin seed|soy sauce/.test(s)},
  ];
  const grouped = {};
  cats.forEach(c => grouped[c.label] = []);
  grouped['🛒 Other'] = [];
  Object.values(totals).forEach(item => {
    const lower = item.item.toLowerCase();
    const cat = cats.find(c => c.test(lower));
    grouped[cat ? cat.label : '🛒 Other'].push(item);
  });
  return grouped;
}

        <span className="card-emoji">{recipe.image}</span>
        <div className="card-header-actions" onClick={e=>e.stopPropagation()}>
          <button className={"fav-btn"+(isFav?' active':'')} onClick={()=>onFavourite(recipe)} title={isFav?'Remove favourite':'Save favourite'}>{isFav?'♥':'♡'}</button>
          <button className="reroll-btn" onClick={()=>onReroll(dayIndex,mealType)} title="Swap this meal">🔀</button>
        </div>
      </div>
      <div className="card-body">
        <h4 className="card-title">{recipe.name}</h4>
        <p className="card-source"><a href={recipe.sourceUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}>{recipe.source}</a></p>
        <div className="card-tags">
          {recipe.category.slice(0,3).map(cat=>(
            <span key={cat} className="card-tag" style={{background:TAG_STYLES[cat]?.bg||'rgba(255,255,255,0.06)',color:TAG_STYLES[cat]?.color||'#aaa'}}>{TAG_LABELS[cat]||cat}</span>
          ))}
        </div>
        <div className="card-meta">
          <span>⏱ {recipe.prepTime+recipe.cookTime}m</span>
          <span>🔥 {recipe.nutrition.calories} kcal</span>
        </div>
        <div className="card-nutrition">
          {[['Protein',recipe.nutrition.protein,'g','#4ade80','rgba(74,222,128,0.12)'],['Carbs',recipe.nutrition.carbs,'g','#fbbf24','rgba(251,191,36,0.12)'],['Fat',recipe.nutrition.fat,'g','#f87171','rgba(248,113,113,0.12)'],['Fibre',recipe.nutrition.fibre,'g','#2dd4bf','rgba(45,212,191,0.12)']].map(([lbl,val,unit,color,bg])=>(
            <div key={lbl} className="nutr-pill" style={{background:bg}}>
              <span className="nutr-pill-val" style={{color}}>{val}{unit}</span>
              <span className="nutr-pill-lbl">{lbl}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function WeekGrid({weekPlan,hasGenerated,onReroll,onSelect,onFavourite,isFav,servings,onGenerate}) {
  if (!hasGenerated) return (
    <div className="empty-state">
      <div className="empty-state-inner">
        <span className="empty-emoji">🍽️</span>
        <h2 className="empty-title">Let's Plan Your Week</h2>
        <p className="empty-desc">Set your preferences on the left, then hit <strong>Generate My Week</strong> to get 7 days of curated lunches and dinners.</p>
        <button className="empty-cta" onClick={onGenerate}>✨ Generate My Week</button>
      </div>
    </div>
  );
  return (
    <div>
      <div className="week-grid-header">
        <h2 className="week-grid-title">Your Week's Menu</h2>
        <p className="week-grid-sub">Click any recipe for full details · 🔀 to swap · ♡ to save</p>
      </div>
      <div className="days-grid">
        {weekPlan.map((day,i)=>(
          <div key={day.day}>
            <div className="day-label">{day.day.slice(0,3)}</div>
            <div className="day-meals">
              <div>
                <span className="meal-type-label lunch">☀️ Lunch</span>
                <RecipeCard recipe={day.lunch} onReroll={onReroll} onSelect={onSelect} onFavourite={onFavourite} isFav={day.lunch&&isFav(day.lunch.id)} dayIndex={i} mealType="lunch"/>
              </div>
              <div>
                <span className="meal-type-label dinner">🌙 Dinner</span>
                <RecipeCard recipe={day.dinner} onReroll={onReroll} onSelect={onSelect} onFavourite={onFavourite} isFav={day.dinner&&isFav(day.dinner.id)} dayIndex={i} mealType="dinner"/>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function RecipeModal({recipe,onClose,isFav,onFavourite,servings}) {
  useEffect(()=>{
    const onKey = e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown',onKey);
    document.body.style.overflow='hidden';
    return ()=>{ document.removeEventListener('keydown',onKey); document.body.style.overflow=''; };
  },[onClose]);

  const ingQty = (ing) => fmtQty(ing.perServing ? ing.qty*servings : ing.qty);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close-btn" onClick={onClose}>✕</button>
        <div className="modal-hero">
          <span className="modal-emoji">{recipe.image}</span>
          <div className="modal-hero-info">
            <div className="modal-meal-tag">{recipe.meal==='lunch'?'☀️ Lunch':'🌙 Dinner'}</div>
            <h2 className="modal-title">{recipe.name}</h2>
            <p className="modal-source">From <a href={recipe.sourceUrl} target="_blank" rel="noopener noreferrer">{recipe.source}</a></p>
            <div className="modal-tags">
              {recipe.category.map(cat=>(
                <span key={cat} className="card-tag" style={{background:TAG_STYLES[cat]?.bg||'rgba(255,255,255,0.06)',color:TAG_STYLES[cat]?.color||'#aaa',fontSize:'11px',padding:'3px 8px'}}>{TAG_LABELS[cat]||cat}</span>
              ))}
            </div>
          </div>
          <button className={"modal-fav-btn"+(isFav?' active':'')} onClick={onFavourite}>{isFav?'♥':'♡'}</button>
        </div>
        <div className="modal-stats">
          {[['⏱','Prep',recipe.prepTime+'m'],['🍳','Cook',recipe.cookTime+'m'],['🕐','Total',(recipe.prepTime+recipe.cookTime)+'m'],['🔥','kcal',recipe.nutrition.calories],['👥',servings===1?'Person':'People',servings]].map(([icon,lbl,val])=>(
            <div key={lbl} className="modal-stat">
              <span className="stat-icon">{icon}</span>
              <div><div className="stat-val">{val}</div><div className="stat-lbl">{lbl}</div></div>
            </div>
          ))}
        </div>
        <p className="modal-desc">{recipe.description}</p>
        <div className="modal-body">
          <div className="modal-section">
            <h3 className="modal-section-title">Ingredients</h3>
            <p className="modal-section-sub">For {servings} {servings===1?'person':'people'}</p>
            <ul className="ingredient-list">
              {recipe.ingredients.map((ing,i)=>(
                <li key={i} className="ingredient-item">
                  <span className="ing-dot"/>
                  <span>
                    <span className="ing-qty">{ingQty(ing)}</span>{' '}
                    <span className="ing-unit">{ing.unit}</span>{' '}
                    <span className="ing-name">{ing.item}</span>
                    {ing.perServing && <span className="per-srv">per person</span>}
                  </span>
                </li>
              ))}
            </ul>
          </div>
          <div className="modal-section">
            <h3 className="modal-section-title">Method</h3>
            <p className="modal-section-sub">&nbsp;</p>
            <ol className="steps-list">
              {recipe.steps.map((step,i)=>(
                <li key={i} className="step-item">
                  <span className="step-num">{i+1}</span>
                  <p className="step-text">{step}</p>
                </li>
              ))}
            </ol>
          </div>
          <div className="modal-section full">
            <h3 className="modal-section-title">Nutrition per Serving</h3>
            <div className="nutr-section">
              <div className="cal-box">
                <span className="cal-num">{recipe.nutrition.calories}</span>
                <span className="cal-lbl">kcal / serving</span>
              </div>
              <div className="nutr-bars">
                {[['Protein',recipe.nutrition.protein,60,'g','#4ade80'],['Carbohydrates',recipe.nutrition.carbs,100,'g','#fbbf24'],['Fat',recipe.nutrition.fat,60,'g','#f87171'],['Fibre',recipe.nutrition.fibre,30,'g','#2dd4bf']].map(([name,val,max,unit,color])=>(
                  <div key={name}>
                    <div className="nutr-row-hdr">
                      <span className="nutr-name">{name}</span>
                      <span className="nutr-val" style={{color}}>{val}{unit}</span>
                    </div>
                    <div className="nutr-bg"><div className="nutr-fill" style={{width:Math.min(100,(val/max)*100)+'%',background:color}}/></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ShoppingList({weekPlan,servings}) {
  const [checked,setChecked] = useState({});
  const [copied,setCopied] = useState(false);
  if (!weekPlan) return (
    <div className="empty-state"><div className="empty-state-inner">
      <span className="empty-emoji">🛒</span>
      <h2 className="empty-title">No Shopping List Yet</h2>
      <p className="empty-desc">Generate your week plan first — your full shopping list will appear here.</p>
    </div></div>
  );
  const shoppingList = buildShoppingList(weekPlan,servings);
  const allItems = Object.values(shoppingList).flat();
  const checkedCount = Object.values(checked).filter(Boolean).length;
  const mealNames = [...new Set(weekPlan.flatMap(d=>[d.lunch,d.dinner]).filter(Boolean).map(r=>r.name))];

  const copyList = () => {
    const text = Object.entries(shoppingList).filter(([,v])=>v.length>0).map(([cat,items])=>
      cat+'
'+items.map(i=>'  • '+fmtQty(i.qty)+' '+i.unit+' '+i.item).join('
')
    ).join('

');
    navigator.clipboard.writeText(text).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
  };

  return (
    <div className="shopping-list">
      <div className="shopping-header">
        <div>
          <h2 className="shopping-title">Shopping List</h2>
          <p className="shopping-sub">For {servings} {servings===1?'person':'people'} · {mealNames.length} meals</p>
        </div>
        <div className="shopping-actions">
          <button className="copy-btn" onClick={copyList}>{copied?'✓ Copied!':'📋 Copy List'}</button>
          {checkedCount>0 && <button className="clear-chk-btn" onClick={()=>setChecked({})}>Clear ticks ({checkedCount})</button>}
        </div>
      </div>
      <div className="prog-wrap">
        <div className="prog-track"><div className="prog-fill" style={{width:allItems.length>0?(checkedCount/allItems.length*100)+'%':'0%'}}/></div>
        <span className="prog-lbl">{checkedCount}/{allItems.length}</span>
      </div>
      <div className="meal-summary">
        <div className="meal-summary-title">This week's meals</div>
        <div className="meal-summary-tags">{mealNames.map(n=><span key={n} className="meal-tag">{n}</span>)}</div>
      </div>
      <div className="shop-cats">
        {Object.entries(shoppingList).filter(([,v])=>v.length>0).map(([cat,items])=>(
          <div key={cat} className="shop-cat">
            <div className="cat-title">{cat}</div>
            <ul className="shop-items">
              {items.map((item,i)=>{
                const key=cat+item.item+i;
                return (
                  <li key={key} className={"shop-item"+(checked[key]?' checked':'')} onClick={()=>setChecked(p=>({...p,[key]:!p[key]}))}>
                    <span className={"chkbox"+(checked[key]?' ticked':'')}>{checked[key]?'✓':''}</span>
                    <span className="shop-item-name">{item.item}</span>
                    <span className="shop-item-qty">{fmtQty(item.qty)} {item.unit}</span>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>
      <div className="shop-note">
        <span>💡</span>
        <p>Quantities are combined across all 7 days for {servings} {servings===1?'person':'people'}. Always check your cupboards first!</p>
      </div>
    </div>
  );
}

function FavouritesPanel({favourites,onSelect,onRemove}) {
  if (favourites.length===0) return (
    <div className="empty-state"><div className="empty-state-inner">
      <span className="empty-emoji">♡</span>
      <h2 className="empty-title">No Favourites Yet</h2>
      <p className="empty-desc">Hit <strong>♡</strong> on any recipe card to save it here for future weeks.</p>
    </div></div>
  );
  const lunches = favourites.filter(r=>r.meal==='lunch');
  const dinners = favourites.filter(r=>r.meal==='dinner');
  const FavCard = ({recipe}) => (
    <div className="fav-card" onClick={()=>onSelect(recipe)}>
      <span className="fav-emoji">{recipe.image}</span>
      <div className="fav-body">
        <div className="fav-name">{recipe.name}</div>
        <div className="fav-src">{recipe.source}</div>
        <div className="fav-meta">
          <span>⏱ {recipe.prepTime+recipe.cookTime}m</span>
          <span>🔥 {recipe.nutrition.calories} kcal</span>
          <span>💪 {recipe.nutrition.protein}g protein</span>
        </div>
      </div>
      <button className="fav-remove" onClick={e=>{e.stopPropagation();onRemove(recipe);}} title="Remove">♥</button>
    </div>
  );
  return (
    <div>
      <div className="fav-header">
        <h2 className="fav-title">Your Favourites</h2>
        <p className="fav-sub">{favourites.length} saved recipe{favourites.length!==1?'s':''} · Stored in your browser</p>
      </div>
      {lunches.length>0 && <div className="fav-section"><h3 className="fav-section-title">☀️ Lunches</h3><div className="fav-grid">{lunches.map(r=><FavCard key={r.id} recipe={r}/>)}</div></div>}
      {dinners.length>0 && <div className="fav-section"><h3 className="fav-section-title">🌙 Dinners</h3><div className="fav-grid">{dinners.map(r=><FavCard key={r.id} recipe={r}/>)}</div></div>}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────

function App() {
  const [activeTab,setActiveTab] = useState('Plan');
  const [filters,setFilters] = useState({});
  const [ingredientText,setIngredientText] = useState('');
  const [servings,setServings] = useState(2);
  const [weekPlan,setWeekPlan] = useState(null);
  const [hasGenerated,setHasGenerated] = useState(false);
  const [selectedRecipe,setSelectedRecipe] = useState(null);
  const [favourites,setFavourites] = useState(()=>{
    try { return JSON.parse(localStorage.getItem('mp_favs')||'[]'); } catch { return []; }
  });

  const handleGenerate = useCallback(()=>{
    setWeekPlan(generateWeekPlan(filters,ingredientText));
    setHasGenerated(true);
    setActiveTab('Plan');
  },[filters,ingredientText]);

  const handleReroll = useCallback((dayIndex,mealType)=>{
    setWeekPlan(prev=>{
      if(!prev) return prev;
      const pool = RECIPES.filter(r=>r.meal===mealType);
      const active = Object.entries(filters).filter(([,v])=>v).map(([k])=>k);
      const candidates = pool.filter(r=>{
        if(active.length>0 && !active.some(c=>r.category.includes(c))) return false;
        if(r.id===prev[dayIndex][mealType]?.id) return false;
        return true;
      });
      if(!candidates.length) return prev;
      const pick = candidates[Math.floor(Math.random()*candidates.length)];
      return prev.map((d,i)=>i===dayIndex?{...d,[mealType]:pick}:d);
    });
  },[filters]);

  const toggleFav = useCallback((recipe)=>{
    setFavourites(prev=>{
      const next = prev.some(f=>f.id===recipe.id) ? prev.filter(f=>f.id!==recipe.id) : [...prev,recipe];
      localStorage.setItem('mp_favs',JSON.stringify(next));
      return next;
    });
  },[]);

  const isFav = useCallback((id)=>favourites.some(f=>f.id===id),[favourites]);

  const TABS = ['Plan','Shopping List','Favourites'];

  return (
    <div className="app">
      <Header/>
      <div className="main-layout">
        <aside className="sidebar">
          <FilterPanel filters={filters} setFilters={setFilters} ingredientText={ingredientText} setIngredientText={setIngredientText} servings={servings} setServings={setServings} onGenerate={handleGenerate}/>
        </aside>
        <main className="content">
          <nav className="tabs">
            {TABS.map(tab=>(
              <button key={tab} className={"tab-btn"+(activeTab===tab?' active':'')} onClick={()=>setActiveTab(tab)}>
                {tab==='Favourites'&&favourites.length>0 && <span className="tab-badge">{favourites.length}</span>}
                {tab}
              </button>
            ))}
          </nav>
          {activeTab==='Plan' && <WeekGrid weekPlan={weekPlan} hasGenerated={hasGenerated} onReroll={handleReroll} onSelect={setSelectedRecipe} onFavourite={toggleFav} isFav={isFav} servings={servings} onGenerate={handleGenerate}/>}
          {activeTab==='Shopping List' && <ShoppingList weekPlan={weekPlan} servings={servings}/>}
          {activeTab==='Favourites' && <FavouritesPanel favourites={favourites} onSelect={setSelectedRecipe} onRemove={toggleFav}/>}
        </main>
      </div>
      {selectedRecipe && <RecipeModal recipe={selectedRecipe} onClose={()=>setSelectedRecipe(null)} isFav={isFav(selectedRecipe.id)} onFavourite={()=>toggleFav(selectedRecipe)} servings={servings}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
